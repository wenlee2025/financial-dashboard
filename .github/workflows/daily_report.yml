name: 每日財經分析推播與儀表板更新

on:
  schedule:
    # 1. 台股盤後專報：台灣時間週一至週五 15:30 (UTC 07:30)
    - cron: '30 7 * * 1-5'
    # 2. 美股盤後晨報：台灣時間週一至週五 06:30 (UTC 昨夜 22:30 週日至週四)
    - cron: '30 22 * * 0-4'

  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - 'tw_post'
          - 'us_morning'
          - 'full'
      symbols:
        description: '指定分析標的代碼（選填，逗號分隔，如 2330,NVDA）'
        required: false
        default: ''
        type: string
      no_push:
        description: '略過通訊軟體與 Email 推播 (僅更新儀表板)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 判斷執行模式
        id: determine_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
            echo "SYMBOLS=${{ github.event.inputs.symbols }}" >> $GITHUB_ENV
            echo "NO_PUSH=${{ github.event.inputs.no_push }}" >> $GITHUB_ENV
          else
            # 定時排程依 UTC 時間自動判斷模式
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq 7 ]; then
              echo "MODE=tw_post" >> $GITHUB_ENV
            else
              echo "MODE=us_morning" >> $GITHUB_ENV
            fi
            echo "SYMBOLS=" >> $GITHUB_ENV
            echo "NO_PUSH=false" >> $GITHUB_ENV
          fi

      - name: 執行量化分析與 AI 報告生成流水線
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          CMD_ARGS="--mode $MODE"
          if [ -n "$SYMBOLS" ]; then
            CMD_ARGS="$CMD_ARGS --symbols $SYMBOLS"
          fi
          if [ "$NO_PUSH" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --no-push"
          fi
          python main.py $CMD_ARGS

      - name: 提交並推送最新儀表板與歷史檔案
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "沒有檔案變更，略過提交。"
          else
            git commit -m "chore(docs): 自動更新財經儀表板與歷史日報 [skip ci]"
            git push
          fi
