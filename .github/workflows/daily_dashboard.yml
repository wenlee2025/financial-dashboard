name: Daily Financial Dashboard

on:
  schedule:
    # 每日台股盤後 (UTC 07:30 = 台灣時間 15:30)
    - cron: '30 7 * * 1-5'
    # 每日美股盤後/晨報 (UTC 22:30 = 台灣時間 06:30)
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # 支援手動一鍵觸發

jobs:
  run-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行全量財經分析流水線
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DASHBOARD_URL: "https://wenlee2025.github.io/financial-dashboard/"
        run: |
          python main.py --mode full

      - name: 提交並推送最新儀表板網頁至 GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update daily financial dashboard [skip ci]" && git push)
