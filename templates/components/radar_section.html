<!-- 4.5 多股多維度量化雷達圖橫向對比 (Multi-Stock Radar Comparison) -->
<section id="multiStockRadarSection" class="glass-card rounded-2xl p-4 sm:p-6 glow-bull border border-emerald-500/20 space-y-4 sm:space-y-5">
  <!-- 標題與簡介 -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h3 class="text-sm sm:text-base font-bold text-white flex items-center">
        <i class="fa-solid fa-chart-pie mr-2 text-emerald-400"></i> 多股六大維度量化雷達橫向對比
        <span id="selectedRadarBadge" class="ml-2.5 px-2.5 py-0.5 text-xs font-bold rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
          已選取 3/6 檔
        </span>
      </h3>
      <p class="text-xs text-gray-400 mt-1">
        自由挑選 2 ~ 6 檔核心標的，橫向對比【技術動能、主力籌碼、基本面前瞻、波克夏護城河、風險防禦、多空綜合評分】
      </p>
    </div>

    <!-- 快捷情境按鈕 -->
    <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
      <span class="text-xs text-gray-400 font-medium">快捷：</span>
      <button type="button" onclick="applyRadarPreset('core')" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-gray-800 text-amber-300 border border-amber-500/30 hover:bg-gray-700 transition">
        👑 權值核心
      </button>
      <button type="button" onclick="applyRadarPreset('ai')" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-gray-800 text-cyan-300 border border-cyan-500/30 hover:bg-gray-700 transition">
        ⚡ AI 供應鏈
      </button>
      <button type="button" onclick="applyRadarPreset('top_momentum')" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-gray-800 text-emerald-300 border border-emerald-500/30 hover:bg-gray-700 transition">
        🔥 多頭主升
      </button>
      <button type="button" onclick="clearRadarSelection()" class="px-2.5 py-1 text-xs font-medium rounded-lg bg-gray-800/80 text-gray-400 border border-gray-700 hover:text-white transition">
        <i class="fa-solid fa-rotate-left mr-1"></i>清空
      </button>
    </div>
  </div>

  <!-- 標的挑選器標籤列表 (Pill Chips) -->
  <div class="space-y-2">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between text-xs text-gray-400 gap-2">
      <span>點擊標籤切換選取（支援同時比對 2~6 檔）：</span>
      <div class="relative w-full sm:w-48">
        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-[10px] text-gray-400"></i>
        <input type="text" id="radarSearchInput" oninput="filterRadarChips()" placeholder="過濾候選標的..." class="w-full bg-gray-900 border border-gray-700 text-gray-200 text-xs rounded-lg pl-7 pr-2 py-1.5 sm:py-1 focus:ring-emerald-500">
      </div>
    </div>
    <div id="radarChipContainer" class="flex flex-wrap gap-1.5 sm:gap-2 max-h-28 overflow-y-auto custom-scrollbar p-2 bg-gray-900/50 rounded-xl border border-gray-800/80">
      <!-- 由 JS 動態生成 chip 元素 -->
    </div>
  </div>

  <!-- 主要展示區：左側雷達圖 + 右側對比指標總覽 -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-5 items-start">
    <!-- ECharts 雷達圖容器 (支援手機手勢透傳) -->
    <div class="lg:col-span-7 bg-gray-900/60 rounded-xl p-3 sm:p-4 border border-gray-800/80 overflow-hidden">
      <div id="multiStockRadarChart" class="w-full h-[310px] sm:h-[420px]" style="touch-action: pan-y;"></div>
    </div>

    <!-- 右側橫向對比卡片/列表 -->
    <div class="lg:col-span-5 space-y-3">
      <div class="flex items-center justify-between">
        <h4 class="text-xs font-bold text-gray-300 uppercase tracking-wider flex items-center">
          <i class="fa-solid fa-layer-group mr-1.5 text-indigo-400"></i> 選取標的指標剖析與風控激辯
        </h4>
        <span class="text-[11px] text-gray-400">基準分：0 ~ 100</span>
      </div>

      <div id="radarComparisonCards" class="space-y-2.5 max-h-[390px] overflow-y-auto custom-scrollbar pr-1">
        <!-- 由 JS 動態渲染選中個股的指標分解卡片 -->
      </div>
    </div>
  </div>
</section>
